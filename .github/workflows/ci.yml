name: ci

on:
  pull_request:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Test
        run: go test ./...
      - name: Static build
        run: CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o /tmp/share-manager main.go
      - name: Validate Docker build
        run: docker build -t share-manager-ci .
