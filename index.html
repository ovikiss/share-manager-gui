<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title></title>
  <link rel="icon" href="/share-manager-icon.svg">
  <link rel="stylesheet" id="theme-style-css" href="/styles-modern.css">
  <style>
    body.share-app{max-width:1400px;margin:0 auto;padding:30px 42px 48px;box-sizing:border-box;overflow-x:hidden}
    .share-section{margin-top:22px}.share-card{padding:22px}.share-card h2{margin:0 0 14px;font-size:1.35em}.share-card h3{margin:24px 0 12px;font-size:1.1em}.share-card .hint{color:var(--muted);font-size:.9em;margin:4px 0 9px}.share-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:17px 20px;align-items:start}.share-grid.nfs-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.share-field{display:flex;flex-direction:column;gap:5px;color:var(--muted);font-size:.95em}.share-field input,.share-field select{box-sizing:border-box;width:100%;padding:10px 11px;background:var(--card-strong);border:1px solid var(--border);border-radius:9px;color:var(--text);font:inherit}.path-row{display:flex;gap:8px}.path-row input{min-width:0}.path-row button{flex:0 0 auto}.share-options{border:1px solid var(--border);border-radius:12px;padding:12px 14px;background:var(--card-strong);display:flex;flex-direction:column;gap:8px;color:var(--text)}.share-options label{display:flex;gap:9px;align-items:flex-start}.share-options input,.user-check input{accent-color:var(--blue);margin-top:3px}.user-checks{display:flex;gap:8px;flex-wrap:wrap}.user-check{display:inline-flex;gap:7px;align-items:center;padding:8px 10px;border:1px solid var(--border);border-radius:9px;background:var(--card-strong);color:var(--text);font-weight:400}.share-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:18px}.share-actions button,.share-table button{border:1px solid var(--border);border-radius:9px;padding:9px 13px;background:var(--card-strong);color:var(--text);font:inherit;cursor:pointer}.share-actions button.primary{background:var(--blue);color:#fff;border-color:transparent;font-weight:600}.share-actions button.danger,.share-table button.danger{background:#b3261e;color:#fff;border-color:transparent}.share-actions button:hover,.share-table button:hover,.folder button:hover{filter:brightness(1.08)}.share-table{width:100%;min-width:760px;border-collapse:separate;border-spacing:0}.share-table th,.share-table td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--table-border);vertical-align:top}.share-table th{background:var(--table-head);color:var(--muted);font-weight:600}.share-table th:first-child{border-radius:12px 0 0 12px}.share-table th:last-child{border-radius:0 12px 12px 0}.table-scroll{overflow-x:auto}.status-pill{display:inline-flex;padding:4px 9px;border-radius:999px;background:rgba(53,217,139,.18);color:#35d98b;font-size:.85em}.status-pill.off{background:var(--table-head);color:var(--muted)}.recycle-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin:14px 0}.recycle-card{border:1px solid var(--border);border-radius:13px;padding:13px;background:var(--card-strong)}.recycle-card strong{display:block;margin-bottom:4px}.recycle-card small{display:block;color:var(--muted);overflow-wrap:anywhere;margin-bottom:8px}.empty{padding:18px 10px;color:var(--muted)}.output{margin:14px 0 0;min-height:42px;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--muted);background:var(--table-head);border:1px solid var(--table-border);border-radius:12px;padding:10px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.56);display:grid;place-items:center;z-index:50}.modal[hidden]{display:none}.dialog{width:min(680px,calc(100% - 34px));max-height:82vh;overflow:auto;background:var(--card);border:1px solid var(--border);border-radius:18px;padding:22px;box-shadow:var(--glass-shadow)}.dialog h2{margin-top:0}.crumb{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;padding:10px;border-radius:9px;background:var(--card-strong);overflow-wrap:anywhere}.folder{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid var(--table-border);padding:11px 2px;color:var(--text)}.folder-name{overflow-wrap:anywhere}.folder button{border:1px solid var(--border);border-radius:9px;padding:9px 13px;background:var(--card-strong);color:var(--text);font:inherit;cursor:pointer}.muted{color:var(--muted)}code{font-size:.86em;overflow-wrap:anywhere}@media(max-width:980px){body.share-app{padding:24px 18px 36px}.share-grid.nfs-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:680px){.share-grid,.share-grid.nfs-grid{grid-template-columns:1fr}.topbar{flex-direction:column}.controls{justify-content:flex-start}}
    .path-row button{border:1px solid var(--border);border-radius:9px;padding:9px 13px;background:var(--card-strong);color:var(--text);font:inherit;cursor:pointer}.path-row button:hover{filter:brightness(1.08)}
  </style>
</head>
<body class="share-app">
  <header class="topbar" data-mikrotik-header-root data-brand="share-manager"></header>
  <main>
    <section class="card share-card share-section">
      <h2 data-i18n="sambaShares"></h2><div class="table-scroll" id="samba"></div>
      <h3 data-i18n="addEditShare"></h3>
      <form id="smbform"><div class="share-grid">
        <label class="share-field"><span data-i18n="shareName"></span><input name="name" required pattern="[A-Za-z0-9._-]+" data-i18n-placeholder="shareNamePlaceholder"></label>
        <label class="share-field"><span data-i18n="shareFolder"></span><div class="path-row"><input name="path" required data-i18n-placeholder="pathPlaceholder"><button type="button" onclick="openBrowser('smb')" data-i18n="browse"></button></div></label>
        <div><strong data-i18n="authorizedUsers"></strong><div class="hint" data-i18n="authorizedUsersHint"></div><div id="valid_users" class="user-checks"></div></div>
        <div><strong data-i18n="canWrite"></strong><div class="hint" data-i18n="canWriteHint"></div><div id="write_list" class="user-checks"></div></div>
        <div><strong data-i18n="readOnlyUsers"></strong><div class="hint" data-i18n="readOnlyUsersHint"></div><div id="read_list" class="user-checks"></div></div>
        <div class="share-options"><label><input type="checkbox" name="read_only"><span data-i18n="implicitReadOnly"></span></label><label><input type="checkbox" name="guest_ok"><span data-i18n="guestAccess"></span></label><label><input type="checkbox" name="recycle"><span data-i18n="recycleForDeleted"></span></label></div>
      </div><div class="share-actions"><button class="primary" data-i18n="saveShare"></button></div></form>
    </section>

    <section class="card share-card share-section">
      <h2 data-i18n="sambaUsers"></h2><div class="hint" data-i18n="linuxUserHint"></div><div class="table-scroll" id="smbusers"></div>
      <h3 data-i18n="addChangeSambaPassword"></h3><form id="userform"><div class="share-grid"><label class="share-field"><span data-i18n="linuxUser"></span><input name="username" required pattern="[A-Za-z0-9._-]+" data-i18n-placeholder="usernamePlaceholder"></label><label class="share-field"><span data-i18n="sambaPassword"></span><input type="password" name="password" required minlength="4"></label></div><div class="share-actions"><button class="primary" data-i18n="saveUser"></button></div></form>
    </section>

    <section class="card share-card share-section">
      <h2 data-i18n="nfsExports"></h2><div class="table-scroll" id="nfs"></div><h3 data-i18n="addReplaceExport"></h3>
      <form id="nfsform"><div class="share-grid nfs-grid">
        <label class="share-field"><span data-i18n="exportFolder"></span><div class="path-row"><input name="path" required data-i18n-placeholder="pathPlaceholder"><button type="button" onclick="openBrowser('nfs')" data-i18n="browse"></button></div></label>
        <label class="share-field"><span data-i18n="client"></span><input name="client" required data-i18n-placeholder="clientPlaceholder"></label>
        <label class="share-field"><span data-i18n="access"></span><select name="access"><option value="ro" data-i18n="readOnlyAccess"></option><option value="rw" data-i18n="readWriteAccess"></option></select><span class="hint" data-i18n="readOnlyHint"></span></label>
        <label class="share-field"><span data-i18n="writeConfirmation"></span><select name="timing"><option value="sync" data-i18n="syncSafe"></option><option value="async" data-i18n="asyncFast"></option></select><span class="hint" data-i18n="syncHint"></span></label>
        <label class="share-field"><span data-i18n="clientRootAccess"></span><select name="root"><option value="root_squash" data-i18n="rootRestricted"></option><option value="no_root_squash" data-i18n="rootAllowed"></option></select><span class="hint" data-i18n="rootSquashHint"></span></label>
        <label class="share-field"><span data-i18n="subtreeCheck"></span><select name="subtree"><option value="no_subtree_check" data-i18n="subtreeOff"></option><option value="subtree_check" data-i18n="subtreeOn"></option></select><span class="hint" data-i18n="subtreeHint"></span></label>
      </div><div class="share-actions"><button class="primary" data-i18n="saveExport"></button></div></form>
    </section>

    <section class="card share-card share-section"><h2 data-i18n="recycleBin"></h2><div class="hint" data-i18n="recycleHint"></div><div id="recycle-summary" class="recycle-summary"></div><div class="table-scroll" id="recycle"></div></section>
    <section class="card share-card share-section"><h2 data-i18n="validation"></h2><div class="share-actions"><button type="button" onclick="validateConfig()" data-i18n="validate"></button></div><pre id="output" class="output">—</pre></section>
  </main>
  <div id="browser" class="modal" hidden><div class="dialog"><h2 data-i18n="folderPicker"></h2><div id="crumb" class="crumb"></div><div id="folders"></div><div class="share-actions"><button type="button" onclick="closeBrowser()" data-i18n="cancel"></button></div></div></div>
  <script src="/common/dropdown-utils.js"></script><script src="/common/header.js"></script>
  <script>
    const $=s=>document.querySelector(s), esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const shared=()=>window.MikroTikSharedHeader, t=k=>shared()?.t?.(k)||k;
    const jsPath=path=>"decodeURIComponent('"+encodeURIComponent(path)+"')";
    function applyText(){document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=t(e.dataset.i18n));document.querySelectorAll('[data-i18n-placeholder]').forEach(e=>e.placeholder=t(e.dataset.i18nPlaceholder));document.documentElement.lang=shared()?.getState?.().language||'en';document.title=t('shareManagerTitle');const title=t('shareManagerTitle'),root=$('[data-mikrotik-header-root]');if(root)root.dataset.brandText=title;const brand=$('#brand-text');if(brand)brand.textContent=title;const subtitle=$('#subtitle');if(subtitle)subtitle.textContent=t('shareManagerSubtitle')}
    function output(text){$('#output').textContent=String(text??'')}
    async function api(url,body){const r=await fetch(url,{method:body?'POST':'GET',headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined}),j=await r.json().catch(()=>({}));if(!r.ok||j.error)throw Error(j.error||j.stderr||t('invalidResponse'));return j}
    function checkedUsers(id){return [...document.querySelectorAll('#'+id+' input:checked')].map(x=>x.value).join(' ')}
    function userChecks(users){return users.length?users.map(u=>`<label class="user-check"><input type="checkbox" value="${esc(u)}">${esc(u)}</label>`).join(''):`<span class="muted">${esc(t('noSambaUsers'))}</span>`}
    async function loadUsers(){const j=await api('/api/users');for(const id of ['valid_users','write_list','read_list'])$('#'+id).innerHTML=userChecks(j.users);$('#smbusers').innerHTML=j.users.length?`<table class="share-table"><thead><tr><th>${t('linuxUser')}</th><th></th></tr></thead><tbody>${j.users.map(u=>`<tr><td><b>${esc(u)}</b></td><td><button onclick="changePassword(${jsPath(u)})">${t('changePassword')}</button><button class="danger" onclick="deleteUser(${jsPath(u)})">${t('deleteFromSamba')}</button></td></tr>`).join('')}</tbody></table>`:`<div class="empty">${t('noSambaUsers')}</div>`}
    function describeNfs(options){const known={ro:t('readOnlyAccess'),rw:t('readWriteAccess'),sync:t('syncSafe'),async:t('asyncFast'),root_squash:t('rootRestricted'),no_root_squash:t('rootAllowed'),no_subtree_check:t('subtreeOff'),subtree_check:t('subtreeOn')};return String(options||'').replace(/[()]/g,'').split(',').map(x=>known[x.trim()]||x.trim()).filter(Boolean).join(' · ')}
    async function load(){const s=await api('/api/state');$('#samba').innerHTML=s.samba.length?`<table class="share-table"><thead><tr><th>${t('shareName')}</th><th>${t('sharePath')}</th><th>${t('mode')}</th><th>${t('recycle')}</th><th></th></tr></thead><tbody>${s.samba.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${esc(x.path)}</td><td>${x.read_only?t('readOnly'):t('readWrite')}</td><td><span class="status-pill ${x.recycle?'':'off'}">${x.recycle?t('on'):t('off')}</span></td><td><button onclick="editSmb(JSON.parse(${jsPath(JSON.stringify(x))}))">${t('edit')}</button><button class="danger" onclick="deleteSmb(${jsPath(x.name)})">${t('delete')}</button></td></tr>`).join('')}</tbody></table>`:`<div class="empty">${t('noShares')}</div>`;$('#nfs').innerHTML=s.nfs.length?`<table class="share-table"><thead><tr><th>${t('sharePath')}</th><th>${t('client')}</th><th>${t('explainedOptions')}</th><th></th></tr></thead><tbody>${s.nfs.map(x=>`<tr><td>${esc(x.path)}</td><td>${esc(x.client||'')}</td><td><span class="muted">${esc(describeNfs(x.options))}</span><br><code>${esc(x.options||'')}</code></td><td><button onclick="editNfs(JSON.parse(${jsPath(JSON.stringify(x))}))">${t('edit')}</button><button class="danger" onclick="deleteNfs(${jsPath(x.path)})">${t('delete')}</button></td></tr>`).join('')}</tbody></table>`:`<div class="empty">${t('noExports')}</div>`;$('#recycle-summary').innerHTML=s.samba.length?s.samba.map(x=>`<div class="recycle-card"><strong>${esc(x.name)}</strong><small>${esc(x.path)}</small><span class="status-pill ${x.recycle?'':'off'}">${t('recycle')}: ${x.recycle?t('on'):t('off')}</span></div>`).join(''):`<div class="empty">${t('noShares')}</div>`;$('#recycle').innerHTML=s.recycle.length?`<table class="share-table"><thead><tr><th>${t('shareName')}</th><th>${t('sharePath')}</th><th></th></tr></thead><tbody>${s.recycle.map(x=>`<tr><td>${esc(x.share)}</td><td>${esc(x.path)}</td><td><button onclick="restore(${jsPath(x.share)},${jsPath(x.path)})">${t('restore')}</button></td></tr>`).join('')}</tbody></table>`:`<div class="empty">${t('emptyRecycle')}</div>`}
    function setUsers(id,value){const selected=new Set(String(value||'').split(/\s+/).filter(Boolean));document.querySelectorAll('#'+id+' input').forEach(x=>x.checked=selected.has(x.value))}
    function editSmb(x){const f=$('#smbform');f.name.value=x.name;f.path.value=x.path;f.read_only.checked=x.read_only;f.guest_ok.checked=x.guest_ok;f.recycle.checked=x.recycle;setUsers('valid_users',x.valid_users);setUsers('write_list',x.write_list);setUsers('read_list',x.read_list);f.scrollIntoView({behavior:'smooth',block:'start'})}
    function editNfs(x){const f=$('#nfsform'),options=String(x.options||'').replace(/[()]/g,'').split(',').map(v=>v.trim()).filter(Boolean);f.path.value=x.path||'';f.client.value=x.client||'';for(const key of ['access','timing','root','subtree']){const value=key==='access'?['ro','rw'].find(v=>options.includes(v)):key==='timing'?['sync','async'].find(v=>options.includes(v)):key==='root'?['root_squash','no_root_squash'].find(v=>options.includes(v)):['no_subtree_check','subtree_check'].find(v=>options.includes(v));if(value)f[key].value=value}f.scrollIntoView({behavior:'smooth',block:'start'})}
    async function restore(share,path){try{const j=await api('/api/recycle/restore',{share,path});output(t('restoreCompleted').replace('{destination}',j.destination));await load()}catch(e){output(t('errorPrefix')+e.message)}}
    async function deleteSmb(name){if(!confirm(t('confirmDeleteShare').replace('{name}',name)))return;try{const j=await api('/api/samba/delete',{name});output(t('deletedWithBackup').replace('{backup}',j.backup));await load()}catch(e){output(t('errorPrefix')+e.message)}}
    async function deleteNfs(path){if(!confirm(t('confirmDeleteExport').replace('{path}',path)))return;try{const j=await api('/api/nfs/delete',{path});output(t('deletedWithBackup').replace('{backup}',j.backup));await load()}catch(e){output(t('errorPrefix')+e.message)}}
    async function deleteUser(username){if(!confirm(t('confirmDeleteUser').replace('{username}',username)))return;try{const j=await api('/api/users/delete',{username});output(t('userDeleted').replace('{backup}',j.backup));await loadUsers();await load()}catch(e){output(t('errorPrefix')+e.message)}}
    function changePassword(username){const f=$('#userform');f.username.value=username;f.password.value='';f.scrollIntoView({behavior:'smooth',block:'center'});setTimeout(()=>f.password.focus(),300)}
    $('#smbform').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{const j=await api('/api/samba/share',{name:f.get('name'),path:f.get('path'),valid_users:checkedUsers('valid_users'),write_list:checkedUsers('write_list'),read_list:checkedUsers('read_list'),read_only:f.has('read_only'),guest_ok:f.has('guest_ok'),recycle:f.has('recycle')});output(t('savedWithBackup').replace('{backup}',j.backup));await load()}catch(x){output(t('errorPrefix')+x.message)}};
    $('#userform').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{const j=await api('/api/users/create',{username:f.get('username'),password:f.get('password')});e.target.reset();output(t('savedWithBackup').replace('{backup}',j.backup));await loadUsers()}catch(x){output(t('errorPrefix')+x.message)}};
    $('#nfsform').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{const j=await api('/api/nfs/export',{path:f.get('path'),client:f.get('client'),options:'('+[f.get('access'),f.get('timing'),f.get('root'),f.get('subtree')].join(',')+')'});output(t('savedWithBackup').replace('{backup}',j.backup));await load()}catch(x){output(t('errorPrefix')+x.message)}};
    let browsePath='/mnt',browseTarget='smb';async function openBrowser(target='smb',path='/mnt'){browseTarget=target;browsePath=path;$('#browser').hidden=false;await showFolders()}function closeBrowser(){$('#browser').hidden=true}async function showFolders(){try{const j=await api('/api/browse?path='+encodeURIComponent(browsePath));$('#crumb').textContent=browsePath;const parent=browsePath.replace(/\/[^/]+$/,'')||'/mnt';const up=browsePath!='/mnt'?`<div class="folder" onclick="openBrowser('${browseTarget}',${jsPath(parent)})"><span>..</span><span class="muted">${t('rootFolder')}</span></div>`:'';$('#folders').innerHTML=up+j.entries.map(x=>`<div class="folder"><span class="folder-name">📁 ${esc(x.name)}</span><button type="button" onclick="chooseFolder(${jsPath(x.path)},event)">${t('addFolder')}</button></div>`).join('')+(browsePath!='/mnt'?`<div class="share-actions"><button type="button" onclick="chooseFolder(${jsPath(browsePath)},event)">${t('addFolder')}</button></div>`:'')}catch(e){$('#folders').textContent=e.message}}
    function chooseFolder(path,event){event?.preventDefault();event?.stopPropagation();const form=browseTarget==='nfs'?'#nfsform':'#smbform';$(form+' input[name="path"]').value=path;closeBrowser()}
    async function validateConfig(){try{output(JSON.stringify(await api('/api/validate'),null,2))}catch(e){output(t('errorPrefix')+e.message)}}
    async function start(){applyText();await Promise.all([loadUsers(),load()])}
    const ready=shared()?.ready||shared()?.whenReady?.();if(ready?.then)ready.then(start);else start();window.addEventListener('mikrotik:header-ready',start,{once:true});window.addEventListener('mikrotik:header-setting-changed',e=>{if(['language','theme','themeStyle','fontSize'].includes(e.detail?.key)){applyText();loadUsers();load()}});
  </script>
</body>
</html>
